variables:
  MAVEN_OPTS: "
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Dorg.slf4j.simpleLogger.log.com.github.dockerjava=WARN
    -Djava.awt.headless=true"

  MAVEN_CLI_OPTS: "
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true"

cache:
  paths:
    - .m2/repository

stages:
  - Prepare
  - Build

"Maven Build":
  image: maven:3-eclipse-temurin-21-alpine
  stage: Build
  script:
    - mvn ${MAVEN_CLI_OPTS} -s .m2/gitlab-ci_settings.xml deploy -DskipTests

"Update Dependencies":
  image: maven:3-eclipse-temurin-21-alpine
  stage: Prepare
  before_script:
    - export UPDATE_BRANCH="VERSION_UPDATE_$(date +%m-%d-%Y)"
    - export COMMIT_MESSAGE="Version Update $(date +%m-%d-%Y)"
    - apk add git curl coreutils grep sed gawk
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - |
      echo "=== Starting Comprehensive 4-Day Stability Check ==="
      COOLDOWN_SEC=345600 # 4 Days
      
      echo "Scanning modules for dependencies..."
      # 1a. Capture normal dependencies via Maven (may miss modules with inter-module dependency resolution failures)
      DEPS_NORMAL=$(mvn ${MAVEN_CLI_OPTS} dependency:list -DexcludeTransitive=true | grep "\[INFO\]" | awk '$2 ~ /:/ {print $2}' | cut -d: -f1,2 || true)
      
      # 1b. Also parse <dependency> blocks directly from all pom.xml files (fallback for modules missed by dependency:list)
      echo "Scanning pom.xml files for direct dependencies..."
      DEPS_POM=$(find . -name "pom.xml" -not -path "*/target/*" | while read -r POM; do
          awk '
            /<dependency>/ { in_dep=1; g=""; a="" }
            in_dep && /<groupId>/ { gsub(/.*<groupId>|<\/groupId>.*/, "", $0); g=$0 }
            in_dep && /<artifactId>/ { gsub(/.*<artifactId>|<\/artifactId>.*/, "", $0); a=$0 }
            in_dep && /<\/dependency>/ { if (g && a) print g":"a; in_dep=0 }
          ' "$POM"
      done || true)
      
      # Merge dependency:list results with pom.xml-parsed results
      DEPS_NORMAL=$(echo -e "${DEPS_NORMAL}\n${DEPS_POM}" | sort -u || true)
      
      # 2. Capture BOMs (Add || true to prevent failure if no BOMs found)
      echo "Scanning for BOMs..."
      BOMS=$(find . -name "pom.xml" -exec grep -h -B 10 "<scope>import</scope>" {} + | \
             grep -E "<groupId>|<artifactId>" | \
             sed 's/[[:space:]]*<[^>]*>//g' | \
             awk 'NR%2{p=$0;next}{print p":"$0}' || true)
      
      # 3. Merge, unique, and strip all whitespace/none
      # Filter out project's own group ID (com.github.roskart) because internal modules don't need a cooldown.
      DEPS=$(echo -e "${DEPS_NORMAL}\n${BOMS}" | sort -u | grep -v "com.github.roskart" | grep -v "none" | grep ":" | tr -d '[:blank:]' || true)
      
      if [ -z "$DEPS" ]; then
        echo "Warning: No external dependencies found to check."
      fi
      
      STABLE_LIST=""
      for DEP in $DEPS; do
        G_ID=$(echo $DEP | cut -d: -f1)
        A_ID=$(echo $DEP | cut -d: -f2)
        G_PATH=$(echo $G_ID | tr '.' '/')
        URL="https://repo1.maven.org/maven2/$G_PATH/$A_ID/maven-metadata.xml"
        
        # One-shot fetch: Get content and check success (HTTP 200) simultaneously
        XML=$(curl -s -f "$URL")
        
        if [ $? -eq 0 ]; then
          LAST_UPDATED=$(echo "$XML" | sed -n 's/.*<lastUpdated>\(.*\)<\/lastUpdated>.*/\1/p' | head -n 1)
          
          if [ ! -z "$LAST_UPDATED" ]; then
            F_DATE="${LAST_UPDATED:0:4}-${LAST_UPDATED:4:2}-${LAST_UPDATED:6:2} ${LAST_UPDATED:8:2}:${LAST_UPDATED:10:2}:${LAST_UPDATED:12:2}"
            LAST_SEC=$(date -d "$F_DATE" +%s)
            NOW_SEC=$(date +%s)
            DIFF_SEC=$((NOW_SEC - LAST_SEC))
            DAYS=$((DIFF_SEC / 86400))
            
            if [ $DIFF_SEC -lt $COOLDOWN_SEC ]; then
              echo "  [SKIP]  $DEP - Released only $DAYS day(s) ago ($F_DATE)"
            else
              echo "  [OK]    $DEP - Stable ($DAYS days old)"
              STABLE_LIST="${STABLE_LIST}${DEP},"
            fi
          fi
        else
          echo "  [SKIP]  $DEP - Not found on Maven Central or connection error"
        fi
      done
      
      STABLE_LIST=${STABLE_LIST%,}
      if [ -z "$STABLE_LIST" ]; then
        echo "=== Result: NO STABLE UPDATES FOUND. ==="
        exit 0
      fi
      echo "=== Result: Proceeding with update for stable packages only. ==="
    - git checkout -b "$UPDATE_BRANCH" $CI_COMMIT_SHA
    - mvn versions:update-properties -Dincludes="$STABLE_LIST"
    - mvn -f dropwizard-jaxws/pom.xml versions:update-properties -Dincludes="$STABLE_LIST"
    - mvn -f dropwizard-jaxws-example/pom.xml versions:update-properties -Dincludes="$STABLE_LIST"
    - |-
      if [ "$( git status --porcelain | awk 'match($1, 'M'){print $2}' | grep "pom.xml$" | wc -l)" -gt "0" ]; then
        git commit --message "${COMMIT_MESSAGE}" pom.xml dropwizard-jaxws/pom.xml dropwizard-jaxws-example/pom.xml
        git push   --push-option merge_request.create \
                   --push-option merge_request.target=${CI_DEFAULT_BRANCH} \
                   --push-option merge_request.remove_source_branch \
                   --push-option merge_request.title="${COMMIT_MESSAGE}" \
                   --push-option merge_request.merge_when_pipeline_succeeds \
                   "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
                   "$UPDATE_BRANCH"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH