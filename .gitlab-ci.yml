variables:
  MAVEN_OPTS: "
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
    -Dorg.slf4j.simpleLogger.log.com.github.dockerjava=WARN
    -Djava.awt.headless=true"

  MAVEN_CLI_OPTS: "
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true"

cache:
  paths:
    - .m2/repository

stages:
  - Prepare
  - Build

"Maven Build":
  image: maven:3-eclipse-temurin-21-alpine
  stage: Build
  script:
    - mvn ${MAVEN_CLI_OPTS} -s .m2/gitlab-ci_settings.xml deploy -DskipTests

"Update Dependencies":
  image: maven:3-eclipse-temurin-21-alpine
  stage: Prepare
  before_script:
    - export UPDATE_BRANCH="VERSION_UPDATE_$(date +%m-%d-%Y)"
    - export COMMIT_MESSAGE="Version Update $(date +%m-%d-%Y)"
    - apk add git curl
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git config --global user.name "${GITLAB_USER_NAME}"
  script:
    - |
      echo "=== Executing 4-day update cooldown check ==="
      # Use Dropwizard BOM release time as the benchmark for stability
      METADATA_URL="https://repo1.maven.org/maven2/io/dropwizard/dropwizard-bom/maven-metadata.xml"
      # Extract lastUpdated value (yyyyMMddHHmmss) using sed
      LAST_UPDATED=$(curl -s $METADATA_URL | sed -n 's/.*<lastUpdated>\(.*\)<\/lastUpdated>.*/\1/p' | head -n 1)
      
      if [ -z "$LAST_UPDATED" ]; then
        echo "Could not retrieve metadata, skipping cooldown check."
      else
        # Convert format: 20240520123000 -> 2024-05-20 12:30:00
        F_DATE="${LAST_UPDATED:0:4}-${LAST_UPDATED:4:2}-${LAST_UPDATED:6:2} ${LAST_UPDATED:8:2}:${LAST_UPDATED:10:2}:${LAST_UPDATED:12:2}"
        LAST_SEC=$(date -d "$F_DATE" +%s)
        NOW_SEC=$(date +%s)
        DIFF_SEC=$((NOW_SEC - LAST_SEC))
        COOLDOWN_SEC=345600 # 4 days = 4 * 24 * 3600
        
        echo "Latest release date: $F_DATE"
        if [ $DIFF_SEC -lt $COOLDOWN_SEC ]; then
          echo "Cooldown active: Latest release is less than 4 days old (current: $((DIFF_SEC / 86400)) days). Stopping update for stability."
          exit 0
        fi
        echo "Check passed: Release is older than 4 days."
      fi
    - git checkout -b "$UPDATE_BRANCH" $CI_COMMIT_SHA
    - mvn versions:update-properties
    - mvn -f dropwizard-jaxws/pom.xml versions:update-properties
    - mvn -f dropwizard-jaxws-example/pom.xml versions:update-properties
    - |-
      if [ "$( git status --porcelain | awk 'match($1, 'M'){print $2}' | grep "pom.xml$" | wc -l)" -gt "0" ]; then
        git commit --message "${COMMIT_MESSAGE}" pom.xml dropwizard-jaxws/pom.xml dropwizard-jaxws-example/pom.xml
        git push   --push-option merge_request.create \
                   --push-option merge_request.target=${CI_DEFAULT_BRANCH} \
                   --push-option merge_request.remove_source_branch \
                   --push-option merge_request.title="${COMMIT_MESSAGE}" \
                   --push-option merge_request.merge_when_pipeline_succeeds \
                   "https://gitlab-ci-token:${GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
                   "$UPDATE_BRANCH"
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH